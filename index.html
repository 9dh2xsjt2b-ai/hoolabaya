<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final 3D school project</title>
  <style>
      body { margin: 0; overflow: hidden; background-color: #74b9ff; font-family: 'Segoe UI', sans-serif; cursor: none; }
      #crosshair {
          position: fixed; top: 50%; left: 50%; width: 8px; height: 8px;
          background: white; border-radius: 50%; transform: translate(-50%, -50%);
          pointer-events: none; z-index: 10; box-shadow: 0 0 4px rgba(0,0,0,0.8);
          transition: all 0.2s ease;
      }
      #interact-tip {
          position: fixed; top: 55%; left: 50%; transform: translateX(-50%);
          color: #f1c40f; font-weight: bold; font-size: 16px; text-shadow: 1px 1px 4px black;
          display: none; pointer-events: none; z-index: 10;
      }
      #temp-msg {
          position: fixed; top: 120px; left: 50%; transform: translateX(-50%);
          color: #00ffcc; font-weight: bold; font-size: 22px; text-shadow: 1px 1px 5px black, 0 0 10px rgba(0,255,200,0.5);
          opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 20;
          background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 8px;
      }
      #hud {
          position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.85);
          color: white; padding: 15px 25px; border-radius: 12px; border-left: 6px solid #e74c3c;
          pointer-events: none; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      }
      #mini-map-container {
          position: absolute; top: 20px; right: 20px; width: 220px; height: 220px;
          background: rgba(0, 0, 0, 0.8); border: 2px solid #555; border-radius: 12px;
          overflow: hidden;
      }
      #mini-map-canvas { width: 100%; height: 100%; }
      #loc-display { font-size: 22px; font-weight: 800; color: #f1c40f; margin-top: 5px; }
      #instructions {
          position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
          background: rgba(255, 255, 255, 0.95); padding: 12px 30px;
          border-radius: 30px; font-size: 14px; color: #111; text-align: center; font-weight: bold;
          box-shadow: 0 5px 15px rgba(0,0,0,0.3); pointer-events: none;
      }
      kbd { background: #222; color: #fff; padding: 2px 8px; border-radius: 4px; border: 1px solid #555; font-family: monospace; }
      #start-overlay {
          position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; flex-direction: column;
          align-items: center; justify-content: center; color: white; z-index: 1000;
      }
      #start-btn { padding: 15px 40px; font-size: 20px; font-weight: bold; background: #e74c3c; border: none; border-radius: 8px; color: white; cursor: pointer; transition: 0.2s; }
      #start-btn:hover { background: #c0392b; transform: scale(1.05); }
  </style>
</head>
<body>


  <div id="start-overlay">
      <h1 style="font-size: 40px; margin-bottom: 10px;">3.3 coming in apr 13th 2026!</h1>
      <p style="font-size: 18px; margin-bottom: 30px; color: #ccc;">By: Mickey Peng</p>
      <button id="start-btn">Start the adventure</button>
  </div>


  <div id="crosshair"></div>
  <div id="interact-tip">[ 左键 ] 交互</div>
  <div id="temp-msg"></div>
   <div id="hud">
      <div style="font-size: 13px; color: #aaa;">Current Area Detection</div>
      <div id="loc-display">Loading……</div>
  </div>


  <div id="mini-map-container">
      <canvas id="mini-map-canvas" width="220" height="220"></canvas>
  </div>


  <div id="instructions">
      <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move | <kbd>Shift</kbd> Sprint/Leave | <kbd>click</kbd> Use high lighted item
  </div>


  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
      let scene, camera, renderer, clock;
      let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
      let velocity = new THREE.Vector3();
      let direction = new THREE.Vector3();
      let isStarted = false;


      const PLAYER_HEIGHT = 1.6;
      const MOVE_SPEED_WALK = 140.0;
      const MOVE_SPEED_SPRINT = 280.0;
      const PLAYER_RADIUS = 0.4;
    
      const colliders = [];
      const roomTriggers = [];
      const animatedDoors = [];
    
      const interactableObjects = [];
      let raycaster = new THREE.Raycaster();
      let mouseCenter = new THREE.Vector2(0, 0);
      let currentHover = null;
      let isUsingFurniture = false;
      let preUsePosition = new THREE.Vector3();
      let isSprinting = false;
      let msgTimeout = null;


      let textures = {};


      function showTempMessage(msg) {
          const el = document.getElementById('temp-msg');
          el.innerText = msg;
          el.style.opacity = 1;
          if(msgTimeout) clearTimeout(msgTimeout);
          msgTimeout = setTimeout(() => { el.style.opacity = 0; }, 2500);
      }


      function createProceduralTextures() {
          const canvasBrick = document.createElement('canvas');
          canvasBrick.width = 256; canvasBrick.height = 256;
          const ctxB = canvasBrick.getContext('2d');
          ctxB.fillStyle = '#8B3A3A'; ctxB.fillRect(0,0,256,256);
          for(let i=0;i<2000;i++){ ctxB.fillStyle=`rgba(0,0,0,${Math.random()*0.15})`; ctxB.fillRect(Math.random()*256,Math.random()*256,2,2); }
          ctxB.fillStyle = '#5c1f1f';
          for(let i=0; i<256; i+=32) {
              let off = (i%64===0)?0:32;
              for(let j=0; j<256; j+=64) ctxB.fillRect(j+off, i, 60, 28);
          }
          textures.brick = new THREE.CanvasTexture(canvasBrick);
          textures.brick.wrapS = textures.brick.wrapT = THREE.RepeatWrapping;


          const canvasWood = document.createElement('canvas');
          canvasWood.width = 256; canvasWood.height = 256;
          const ctxWood = canvasWood.getContext('2d');
          ctxWood.fillStyle = '#d3a567'; ctxWood.fillRect(0,0,256,256);
          ctxWood.strokeStyle = '#b88645'; ctxWood.lineWidth = 2;
          for(let i=0; i<256; i+=16) {
              ctxWood.beginPath(); ctxWood.moveTo(i, 0); ctxWood.lineTo(i, 256); ctxWood.stroke();
          }
          textures.wood = new THREE.CanvasTexture(canvasWood);
          textures.wood.wrapS = textures.wood.wrapT = THREE.RepeatWrapping;


          const canvasTile = document.createElement('canvas');
          canvasTile.width = 128; canvasTile.height = 128;
          const ctxT = canvasTile.getContext('2d');
          ctxT.fillStyle = '#ecf0f1'; ctxT.fillRect(0,0,128,128);
          ctxT.strokeStyle = '#bdc3c7'; ctxT.lineWidth = 2;
          ctxT.strokeRect(0,0,64,64); ctxT.strokeRect(64,64,64,64);
          textures.tile = new THREE.CanvasTexture(canvasTile);
          textures.tile.wrapS = textures.tile.wrapT = THREE.RepeatWrapping;


          const canvasWall = document.createElement('canvas');
          canvasWall.width = 128; canvasWall.height = 128;
          const ctxW = canvasWall.getContext('2d');
          ctxW.fillStyle = '#f8f9fa'; ctxW.fillRect(0,128,128,128);
          ctxW.fillStyle = '#dcdde1'; ctxW.fillRect(0, 120, 128, 8);
          textures.innerWall = new THREE.CanvasTexture(canvasWall);
          textures.innerWall.wrapS = textures.innerWall.wrapT = THREE.RepeatWrapping;


          const canvasBathWall = document.createElement('canvas');
          canvasBathWall.width = 128; canvasBathWall.height = 128;
          const ctxBW = canvasBathWall.getContext('2d');
          ctxBW.fillStyle = '#e0f7fa';
          ctxBW.fillRect(0,0,128,128);
          ctxBW.strokeStyle = '#b2ebf2'; ctxBW.lineWidth = 2;
          for(let i=0; i<=128; i+=16) {
              ctxBW.beginPath(); ctxBW.moveTo(i, 0); ctxBW.lineTo(i, 128); ctxBW.stroke();
              ctxBW.beginPath(); ctxBW.moveTo(0, i); ctxBW.lineTo(128, i); ctxBW.stroke();
          }
          ctxBW.fillStyle = '#b2bec3'; ctxBW.fillRect(0, 120, 128, 8);
          textures.bathWall = new THREE.CanvasTexture(canvasBathWall);
          textures.bathWall.wrapS = textures.bathWall.wrapT = THREE.RepeatWrapping;
      }


      function init() {
          scene = new THREE.Scene();
          scene.background = new THREE.Color(0x87ceeb);
          scene.fog = new THREE.Fog(0x87ceeb, 15, 500);


          camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);
          camera.rotation.order = 'YXZ';
          camera.position.set(0, PLAYER_HEIGHT, 0);


          renderer = new THREE.WebGLRenderer({ antialias: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(window.devicePixelRatio);
        
          renderer.toneMapping = THREE.ACESFilmicToneMapping;
          renderer.toneMappingExposure = 1.2;
          renderer.shadowMap.enabled = true;
          renderer.shadowMap.type = THREE.PCFSoftShadowMap;
          document.body.appendChild(renderer.domElement);


          clock = new THREE.Clock();
          createProceduralTextures();


          scene.add(new THREE.AmbientLight(0xffffff, 0.85));
          const sun = new THREE.DirectionalLight(0xffffff, 1.0);
          sun.position.set(100, 200, 50);
          sun.castShadow = true;
          sun.shadow.mapSize.width = 2048;
          sun.shadow.mapSize.height = 2048;
          sun.shadow.camera.near = 0.5;
          sun.shadow.camera.far = 800;
          sun.shadow.camera.left = -200;
          sun.shadow.camera.right = 200;
          sun.shadow.camera.top = 200;
          sun.shadow.camera.bottom = -200;
          sun.shadow.bias = -0.0005;
          scene.add(sun);


          buildFullCampus();
          setupControls();
        
          window.addEventListener('resize', onResize);
          animate();
      }


      function addBox(x, y, z, w, h, d, mat, addToCollider = true, castShadow = true, receiveShadow = true) {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
          mesh.position.set(x, y, z);
          mesh.castShadow = castShadow;
          mesh.receiveShadow = receiveShadow;
          scene.add(mesh);
          if (addToCollider) {
              colliders.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2, minY: y-h/2, maxY: y+h/2 });
          }
          return mesh;
      }


      function addInteractable(x, y, z, w, h, d, mat, actionText, actionMsg, extraData = {}) {
          const cloneMat = mat.clone();
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), cloneMat);
          mesh.position.set(x, y, z);
          mesh.castShadow = true; mesh.receiveShadow = true;
          scene.add(mesh);
        
          mesh.userData = {
              interactable: true,
              actionText: actionText,
              msg: actionMsg,
              baseEmissive: cloneMat.emissive ? cloneMat.emissive.getHex() : 0x000000,
              ...extraData
          };
          interactableObjects.push(mesh);
          return mesh;
      }


      function addFurniture(x, y, z, w, h, d, mat, sitYOffset = 0.8, actionText="sit down", msg="You sat down.") {
          return addInteractable(x, y, z, w, h, d, mat, actionText, msg, { type: 'sit', usePos: new THREE.Vector3(x, y + sitYOffset, z) });
      }


      function createDoor(x, z, facing, doorW) {
          const doorMat = new THREE.MeshPhongMaterial({ color: 0x4a3b32 });
          const group = new THREE.Group();
        
          let pivotX = x, pivotZ = z;
          let meshX = 0, meshZ = 0;
          let w = doorW, d = 0.2;


          if(facing === 'N' || facing === 'S') {
              pivotX = x - doorW/2; meshX = doorW/2;
          } else {
              pivotZ = z - doorW/2; meshZ = doorW/2;
              w = 0.2; d = doorW;
          }


          group.position.set(pivotX, 0, pivotZ);
          const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(w===0.2?0.2:doorW, 4.45, w===0.2?doorW:0.2), doorMat);
          doorMesh.position.set(meshX, 2.28, meshZ);
          doorMesh.castShadow = true;
          group.add(doorMesh);
          scene.add(group);


          let openRot = (facing === 'N') ? Math.PI/2 : (facing === 'S') ? -Math.PI/2 : (facing === 'E') ? -Math.PI/2 : Math.PI/2;
          animatedDoors.push({ group: group, targetRot: 0, currentRot: 0, openRot: openRot, px: x, pz: z, triggerDist: 4.5 });
      }


      function createStallDoor(x, z, facing, doorW, colorHex) {
          const doorMat = new THREE.MeshPhongMaterial({ color: colorHex });
          const group = new THREE.Group();
          let pivotX = x, pivotZ = z;
          let meshX = 0, meshZ = 0;
          let w = doorW, d = 0.1;


          if(facing === 'N' || facing === 'S') {
              pivotX = x - doorW/2; meshX = doorW/2;
          } else {
              pivotZ = z - doorW/2; meshZ = doorW/2;
              w = 0.1; d = doorW;
          }


          group.position.set(pivotX, 0, pivotZ);
          const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(w===0.1?0.1:doorW, 2.6, w===0.1?doorW:0.1), doorMat);
          doorMesh.position.set(meshX, 1.5, meshZ);
          doorMesh.castShadow = true;
          group.add(doorMesh);
          scene.add(group);


          let openRot = (facing === 'N') ? Math.PI/2 : (facing === 'S') ? -Math.PI/2 : (facing === 'E') ? -Math.PI/2 : Math.PI/2;
          animatedDoors.push({ group: group, targetRot: 0, currentRot: 0, openRot: openRot, px: x, pz: z, triggerDist: 2.5 });
      }


      function addCeilingLight(x, z, w, d, h) {
          const lightMat = new THREE.MeshBasicMaterial({color: 0xffffff});
          addBox(x, h - 0.05, z, w*0.3, 0.1, d*0.3, lightMat, false, false, false);
      }


      function buildGlobalRoof() {
          const extRoofMat = new THREE.MeshPhongMaterial({color: 0x2d3436});
          addBox(0, 5.9, -40, 54, 0.4, 204, extRoofMat, false, true, true);
          addBox(0, 5.9, 0, 184, 0.4, 44, extRoofMat, false, true, true);
      }


      function buildHollowRoom(x, z, w, d, roomName, type, doorFacing) {
          const h = 5.5;
          const wt = 0.8;
          const doorW = 3.5;


          let innerTex = textures.innerWall.clone();
          if (type.includes('bath')) innerTex = textures.bathWall.clone();
        
          const floorMat = new THREE.MeshPhongMaterial({ map: (type.includes('bath')||type==='corridor') ? textures.tile : textures.wood });
          floorMat.map.repeat.set(w/4, d/4);
          const roofMat = new THREE.MeshPhongMaterial({ color: 0xffffff, emissive: 0x222222 });


          roomTriggers.push({ minX: x-w/2, maxX: x+w/2, minZ: z-d/2, maxZ: z+d/2, name: roomName, type: type });


          const floor = new THREE.Mesh(new THREE.PlaneGeometry(w - 0.1, d - 0.1), floorMat);
          floor.rotation.x = -Math.PI/2; floor.position.set(x, 0.05, z); floor.receiveShadow = true; scene.add(floor);
        
          addBox(x, 5.6, z, w + wt*2 - 0.1, 0.2, d + wt*2 - 0.1, roofMat, false, false, false);
        
          const buildWall = (cx, cz, ww, wd, isDoorWall) => {
              const currentInnerTex = innerTex.clone();
              currentInnerTex.repeat.set(Math.max(ww, wd) / 4, h / 4);
              const wallMat = new THREE.MeshPhongMaterial({ map: currentInnerTex });


              const shrinkW = ww > wd ? ww - 0.02 : ww;
              const shrinkD = wd > ww ? wd - 0.02 : wd;


              if (!isDoorWall) {
                  addBox(cx, h/2, cz, shrinkW, h, shrinkD, wallMat);
              } else {
                  const isNS = (ww > wd);
                  const sideL = isNS ? (ww - doorW)/2 : ww;
                  const sideW = isNS ? ww : (wd - doorW)/2;
                
                  if (isNS) {
                      addBox(cx - ww/2 + sideL/2, h/2, cz, sideL - 0.02, h, shrinkD, wallMat);
                      addBox(cx + ww/2 - sideL/2, h/2, cz, sideL - 0.02, h, shrinkD, wallMat);
                      addBox(cx, h - 0.5, cz, doorW - 0.02, 1, shrinkD, wallMat);
                  } else {
                      addBox(cx, h/2, cz - wd/2 + sideW/2, shrinkW, h, sideW - 0.02, wallMat);
                      addBox(cx, h/2, cz + wd/2 - sideW/2, shrinkW, h, sideW - 0.02, wallMat);
                      addBox(cx, h - 0.5, cz, shrinkW, 1, doorW - 0.02, wallMat);
                  }
                  createDoor(cx, cz, doorFacing, doorW);
              }
          };


          buildWall(x, z - d/2, w, wt, doorFacing === 'N');
          buildWall(x, z + d/2, w, wt, doorFacing === 'S');
          buildWall(x - w/2, z, wt, d, doorFacing === 'W');
          buildWall(x + w/2, z, wt, d, doorFacing === 'E');


          populateInterior(x, z, w, d, type, doorFacing);
      }


      function populateInterior(x, z, w, d, type, doorFacing) {
          const woodMat = new THREE.MeshPhongMaterial({color: 0x8d6e63});
          const metalMat = new THREE.MeshPhongMaterial({color: 0x7f8c8d});
          const whiteMat = new THREE.MeshPhongMaterial({color: 0xffffff});
          const blackMat = new THREE.MeshPhongMaterial({color: 0x2d3436});
          const chairMat = new THREE.MeshPhongMaterial({color: 0x34495e});
          const greenMat = new THREE.MeshPhongMaterial({color: 0x27ae60});


          if (type.includes('bath')) {
              const signMat = new THREE.MeshPhongMaterial({color: 0x27ae60});
              const msg = type === 'boys_bath' ? "Boy's bathroom (Boys)" : "Girl's bathroom (Girls)";
              let sz = z, sx = x, sw = 1.5, sh = 0.6, sd = 0.1;
            
              if (doorFacing === 'S') { sz = z + d/2 + 0.42; }
              else if (doorFacing === 'N') { sz = z - d/2 - 0.42; }
              else if (doorFacing === 'E') { sx = x + w/2 + 0.42; sw = 0.1; sd = 1.5; }
              else if (doorFacing === 'W') { sx = x - w/2 - 0.42; sw = 0.1; sd = 1.5; }
            
              addInteractable(sx, 4.8, sz, sw, sh, sd, signMat, "Read the sign", msg);
          }


          const addTrash = (px, pz) => {
              addInteractable(px, 0.6, pz, 0.8, 1.2, 0.8, new THREE.MeshPhongMaterial({color: 0x2c3e50}), "Throwing away trash", "You throwing away trash");
          };
          const addPlant = (px, pz) => {
              addBox(px, 0.5, pz, 1, 1, 1, whiteMat, false);
              addInteractable(px, 1.8, pz, 1.5, 1.6, 1.5, greenMat, "Watering", "After watering the plant, it looks more vibrant");
          };


          if (type === 'class') {
              addBox(x, 0.9, z - d/2 + 2.5, 4, 0.1, 2, woodMat, false);
              addBox(x - 1.9, 0.45, z - d/2 + 2.5, 0.1, 0.9, 1.8, woodMat, false);
              addBox(x + 1.9, 0.45, z - d/2 + 2.5, 0.1, 0.9, 1.8, woodMat, false);
              addBox(x, 0.45, z - d/2 + 1.6, 3.8, 0.9, 0.1, woodMat, false);
            
              const pcMat = new THREE.MeshPhongMaterial({color: 0x2d3436, emissive: 0x000000});
              addInteractable(x, 1.3, z - d/2 + 2.8, 0.8, 0.6, 0.1, pcMat, "Operating a computer", "You open a tab");
              addBox(x, 1.0, z - d/2 + 2.8, 0.2, 0.3, 0.2, blackMat, false);
            
              addInteractable(x + 1.5, 1.3, z - d/2 + 2.5, 0.6, 0.6, 0.6, new THREE.MeshPhongMaterial({color: 0x3498db}), "spin", "The globe was rotated");


              addFurniture(x, 0.45, z - d/2 + 1.0, 1, 0.1, 1, blackMat, 0.5, "sit down", "You sat down");
              addBox(x, 0.9, z - d/2 + 0.6, 1, 0.8, 0.1, blackMat, false);
            
              addInteractable(x, 3, z - d/2 + 0.5, 10, 3.5, 0.1, whiteMat, "Erasing the blackboard", "You erased the blackboard");
            
              addInteractable(x, 5, z - d/2 + 0.55, 1.2, 1.2, 0.1, new THREE.MeshPhongMaterial({color: 0xecf0f1}), "Check the time", "Tick-tock, tick-tock, there are still 15 minutes until class ends");
              addInteractable(x - 4, 5, z - d/2 + 0.55, 1, 0.8, 0.5, blackMat, "Listen to the radio", "Sorry to interrupt, we won't be able to go outside because there's an activity.");


              addTrash(x - 4, z - d/2 + 2);


              const startX = x - w/2 + 4; const startZ = z - d/2 + 7;
              const cols = Math.floor((w-6)/4);
              for (let r = 0; r < 3; r++) {
                  for (let c = 0; c < cols; c++) {
                      let dx = startX + c * 4; let dz = startZ + r * 3.5;
                      addInteractable(dx, 0.8, dz, 2.2, 0.1, 1.5, woodMat, "Check the desks", "There's a math book on the desk");
                      addBox(dx, 0.4, dz, 2.0, 0.8, 1.3, metalMat, false);
                      addFurniture(dx, 0.45, dz + 1.3, 1.0, 0.1, 1.0, chairMat, 0.5, "Listen to the lecture", "Sat down and learning");
                      addBox(dx, 0.9, dz + 1.6, 1.0, 0.8, 0.1, chairMat, false);
                      addBox(dx - 0.4, 0.225, dz + 0.8, 0.1, 0.45, 0.1, metalMat, false);
                      addBox(dx + 0.4, 0.225, dz + 0.8, 0.1, 0.45, 0.1, metalMat, false);
                      addBox(dx - 0.4, 0.225, dz + 1.6, 0.1, 0.45, 0.1, metalMat, false);
                      addBox(dx + 0.4, 0.225, dz + 1.6, 0.1, 0.45, 0.1, metalMat, false);
                  }
              }
          }
          else if (type === 'boys_bath') {
              addBox(x - w/2 + 2, 1.2, z, 1.5, 0.8, d-6, whiteMat, false);
              addInteractable(x - w/2 + 2.5, 1.5, z, 0.5, 0.2, 0.5, metalMat, "Wash hands", "Splash... washed hands carefully with hand sanitizer.");
              addInteractable(x - w/2 + 1.1, 2.8, z, 0.1, 2.5, d-6, new THREE.MeshPhongMaterial({color: 0x81ecec}), "Looking in the mirror", "Looks good");
              addInteractable(x - w/2 + 1.2, 1.8, z - d/2 + 3, 0.5, 0.6, 0.4, metalMat, "blow dry", "Whoosh... The strong hot air dried your hands.");
            
              for (let i = 0; i < 3; i++) {
                  let pz = z - d/2 + 4 + i*2.5;
                  addInteractable(x + w/2 - 1, 1.3, pz, 0.6, 1.2, 0.8, whiteMat, "Use", "Automatic sensor flushing... Splash!");
                  addBox(x + w/2 - 1.5, 1.6, pz + 1.25, 2, 2.2, 0.1, new THREE.MeshPhongMaterial({color: 0x3498db}), false);
              }
            
              let stallZ = z + d/2 - 2.5;
              addBox(x + w/2 - 2, 1.8, stallZ - 1.5, 4, 3.5, 0.1, new THREE.MeshPhongMaterial({color: 0x3498db}), false);
              createStallDoor(x + w/2 - 4, stallZ, 'W', 3, 0x3498db);

      function setupControls() {
          document.getElementById('start-btn').addEventListener('click', () => {
              document.body.requestPointerLock();
          });


          document.addEventListener('pointerlockchange', () => {
              isStarted = document.pointerLockElement === document.body;
              document.getElementById('start-overlay').style.display = isStarted ? 'none' : 'flex';
              if (!isStarted) {
                  moveForward = moveBackward = moveLeft = moveRight = isSprinting = false;
              }
          });


          document.addEventListener('keydown', (e) => {
              if (!isStarted) return;
              switch(e.code) {
                  case 'KeyW': case 'ArrowUp': moveForward = true; break;
                  case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                  case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                  case 'KeyD': case 'ArrowRight': moveRight = true; break;
                  case 'Space': if(canJump && !isUsingFurniture) { velocity.y = 12.0; canJump = false; } break;
                  case 'ShiftLeft': case 'ShiftRight':
                      if (isUsingFurniture) {
                          isUsingFurniture = false;
                          camera.position.copy(preUsePosition);
                      } else {
                          isSprinting = true;
                      }
                      break;
              }
          });
          document.addEventListener('keyup', (e) => {
              switch(e.code) {
                  case 'KeyW': case 'ArrowUp': moveForward = false; break;
                  case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                  case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                  case 'KeyD': case 'ArrowRight': moveRight = false; break;
                  case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
              }
          });


          document.addEventListener('mousedown', (e) => {
              if (isStarted && currentHover && !isUsingFurniture && e.button === 0) {
                  const action = currentHover.userData.type;
                
                  if (action === 'sit') {
                      isUsingFurniture = true;
                      preUsePosition.copy(camera.position);
                      camera.position.copy(currentHover.userData.usePos);
                      velocity.set(0,0,0);
                      showTempMessage(currentHover.userData.msg);
                  } else {
                      showTempMessage(currentHover.userData.msg);
                      currentHover.position.y -= 0.05;
                      setTimeout(() => { currentHover.position.y += 0.05; }, 100);
                  }
              }
          });
        
          document.addEventListener('mousemove', (e) => {
              if (isStarted) {
                  camera.rotation.y -= e.movementX * 0.002;
                  camera.rotation.x -= e.movementY * 0.002;
                  camera.rotation.x = Math.max(-1.5, Math.min(1.5, camera.rotation.x));
              }
          });
      }


      function checkCollision(nx, nz) {
          for (let c of colliders) {
              if (nx + PLAYER_RADIUS > c.minX && nx - PLAYER_RADIUS < c.maxX &&
                  nz + PLAYER_RADIUS > c.minZ && nz - PLAYER_RADIUS < c.maxZ) {
                  if(camera.position.y > c.minY && camera.position.y - PLAYER_HEIGHT < c.maxY) {
                      return true;
                  }
              }
          }
          return false;
      }


      function drawMiniMap() {
          const canvas = document.getElementById('mini-map-canvas');
          const ctx = canvas.getContext('2d');
          ctx.clearRect(0, 0, 220, 220);
          const scale = 0.7; const ox = 110; const oz = 120;


          ctx.fillStyle = 'rgba(150, 150, 150, 0.6)';
          roomTriggers.forEach(r => {
              ctx.fillRect(ox + r.minX*scale, oz + r.minZ*scale, (r.maxX-r.minX)*scale, (r.maxZ-r.minZ)*scale);
              ctx.strokeStyle = 'rgba(255,255,255,0.3)';
              ctx.strokeRect(ox + r.minX*scale, oz + r.minZ*scale, (r.maxX-r.minX)*scale, (r.maxZ-r.minZ)*scale);
          });
        
          const px = ox + camera.position.x * scale;
          const pz = oz + camera.position.z * scale;
          ctx.save();
          ctx.translate(px, pz);
          ctx.rotate(-camera.rotation.y);
          ctx.beginPath();
          ctx.moveTo(0, -8); ctx.lineTo(5, 5); ctx.lineTo(-5, 5);
          ctx.fillStyle = '#2ecc71'; ctx.fill();
          ctx.restore();
      }


      function animate() {
          requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.1);


          if (isStarted) {
              let targetFov = isUsingFurniture ? 60 : (isSprinting ? 95 : 75);
              camera.fov += (targetFov - camera.fov) * 0.1;
              camera.updateProjectionMatrix();


              raycaster.setFromCamera(mouseCenter, camera);
              const intersects = raycaster.intersectObjects(interactableObjects);
              const crosshair = document.getElementById('crosshair');
              const interactTip = document.getElementById('interact-tip');


              if (intersects.length > 0 && intersects[0].distance < 4 && !isUsingFurniture) {
                  if (currentHover !== intersects[0].object) {
                      if (currentHover) currentHover.material.emissive.setHex(currentHover.userData.baseEmissive);
                      currentHover = intersects[0].object;
                      currentHover.material.emissive.setHex(0x555555);
                  }
                
                  crosshair.style.borderColor = '#f1c40f';
                  crosshair.style.transform = 'translate(-50%, -50%) scale(1.5)';
                  interactTip.innerText = `[ Left click ] ${currentHover.userData.actionText}`;
                  interactTip.style.display = 'block';
              } else {
                  if (currentHover) {
                      currentHover.material.emissive.setHex(currentHover.userData.baseEmissive);
                      currentHover = null;
                  }
                  crosshair.style.borderColor = 'white';
                  crosshair.style.transform = 'translate(-50%, -50%) scale(1)';
                  interactTip.style.display = 'none';
              }


              if (!isUsingFurniture) {
                  velocity.y -= 30 * dt;
                  camera.position.y += velocity.y * dt;
                  if (camera.position.y < PLAYER_HEIGHT) {
                      camera.position.y = PLAYER_HEIGHT;
                      velocity.y = 0; canJump = true;
                  }


                  direction.z = Number(moveForward) - Number(moveBackward);
                  direction.x = Number(moveRight) - Number(moveLeft);
                  direction.normalize();


                  if (moveForward || moveBackward || moveLeft || moveRight) {
                      const camDir = new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
                      camDir.y = 0; camDir.normalize();
                      const camRight = new THREE.Vector3().crossVectors(camDir, new THREE.Vector3(0,1,0)).normalize();
                    
                      const speed = isSprinting ? MOVE_SPEED_SPRINT : MOVE_SPEED_WALK;
                      const moveVec = new THREE.Vector3().addScaledVector(camDir, direction.z).addScaledVector(camRight, direction.x);
                    
                      if (moveVec.lengthSq() > 0) {
                          moveVec.normalize().multiplyScalar(speed * dt * 0.1);
                          if (!checkCollision(camera.position.x + moveVec.x, camera.position.z)) camera.position.x += moveVec.x;
                          if (!checkCollision(camera.position.x, camera.position.z + moveVec.z)) camera.position.z += moveVec.z;
                      }
                  }
              } else {
                  interactTip.innerText = "[ Shift ] Stand up / Leave";
                  interactTip.style.display = 'block';
              }


              animatedDoors.forEach(door => {
                  const trigDist = door.triggerDist || 4.5;
                  const dist = Math.hypot(camera.position.x - door.px, camera.position.z - door.pz);
                  door.targetRot = (dist < trigDist) ? door.openRot : 0;
                  door.currentRot += (door.targetRot - door.currentRot) * 0.1;
                  door.group.rotation.y = door.currentRot;
              });


              let currentLoc = "Outside";
              for (let r of roomTriggers) {
                  if (camera.position.x > r.minX && camera.position.x < r.maxX && camera.position.z > r.minZ && camera.position.z < r.maxZ) {
                      currentLoc = r.name; break;
                  }
              }
              if (currentLoc === "Outside" && (Math.abs(camera.position.x) < 6 || Math.abs(camera.position.z) < 6)) currentLoc = "Corridor";
              document.getElementById('loc-display').innerText = currentLoc;


              drawMiniMap();
          }
          renderer.render(scene, camera);
      }


      function onResize() {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
      }


      init();
  </script>
