<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link's Awakening DX: Classic Boss Gauntlet</title>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }
        #game-wrapper {
            position: relative;
            border: 20px solid #4a4a4a;
            border-radius: 10px 10px 30px 10px;
            box-shadow: inset 0 0 10px #000, 0 0 20px rgba(255,255,255,0.2);
            background: #000;
            padding: 10px;
        }
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 512px;
            height: 384px;
            background: #c0d8b0;
            display: block;
            border: 2px solid #000;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
        }
        .hearts {
            color: #ff3333;
            font-size: 24px;
            text-shadow: 2px 2px 0 #000;
            letter-spacing: 2px;
        }
        #instructions {
            margin-top: 15px;
            color: #ccc;
            text-align: center;
            line-height: 1.6;
            font-size: 14px;
        }
        .highlight { color: #f1c40f; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="ui-layer">
        <div>
            <div style="font-size: 12px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 #000; margin-bottom: 4px;">- LIFE -</div>
            <div id="player-hearts" class="hearts">❤️❤️❤️</div>
        </div>
        <div id="boss-info" style="text-align: right;">
            <div id="boss-name" style="font-size: 12px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 #000;">BOSS: 1/10</div>
            <div id="boss-hp-bar" style="width: 60px; height: 4px; background: #333; border: 1px solid #fff; margin-top: 4px;">
                <div id="boss-hp-fill" style="width: 100%; height: 100%; background: #f1c40f;"></div>
            </div>
        </div>
    </div>
    <canvas id="gameCanvas" width="256" height="192"></canvas>
</div>

<div id="instructions">
    <span class="highlight">WASD</span>: Move | <span class="highlight">J</span>: Sword | <span class="highlight">K</span>: Pot | <span class="highlight">L</span>: Dash | <span class="highlight">H</span>: Hook | <span class="highlight">U</span>: Jump | <span class="highlight">B</span>: Bomb | <span class="highlight">P</span>: Powder | <span class="highlight">R</span>: Rod | <span class="highlight">C</span>: Bow<br>
    Level 10: The Creator "Author"! Beware his bullet hell and time freeze!
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const heartsEl = document.getElementById('player-hearts');
    const bossNameEl = document.getElementById('boss-name');
    const bossHpFillEl = document.getElementById('boss-hp-fill');

    const FPS = 60;

    const keys = {};
    window.addEventListener('keydown', e => { 
        keys[e.code] = true; 
        if (e.code === 'KeyJ' || e.code === 'Space') playerAttack();
        if (e.code === 'KeyK') playerInteract();
        if (e.code === 'KeyL') playerDash();
        if (e.code === 'KeyH') playerHookshot();
        if (e.code === 'KeyU') playerJump();
        if (e.code === 'KeyB') playerDropBomb();
        if (e.code === 'KeyP') playerDropPowder();
        if (e.code === 'KeyR') playerShootRod();
        if (e.code === 'KeyC') playerShootArrow();
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    let currentLevel = 1; 
    let projectiles = [];
    let bombs = [];
    let rocks = [];
    let windX = 0;

    let player = {
        x: 128, y: 140, z: 0, vz: 0,
        radius: 6, speed: 1.5,
        hp: 3, maxHp: 3,
        dir: 'up', state: 'idle', 
        timer: 0, invuln: 0,
        vx: 0, vy: 0, hasHit: false, carrying: false,
        attackCooldown: 0,
        powderCooldown: 0,
        arrowCooldown: 0,
        freezeTimer: 0
    };

    let hookshot = { active: false, x: 0, y: 0, vx: 0, vy: 0, length: 0, returning: false, attachedBoss: false };
    let boss = { hp: 4, maxHp: 4, invuln: 0, state: 'move', timer: 0 };

    const BOSS_DATA = [
        { name: "Moldorm", hp: 4 },
        { name: "Genie", hp: 5 },
        { name: "Slime Eye", hp: 12 },
        { name: "Angler Fish", hp: 16 },
        { name: "Slime Eel", hp: 5 },
        { name: "Facade", hp: 5 },
        { name: "Evil Eagle", hp: 14 },
        { name: "Hot Head", hp: 16 },
        { name: "Shadow Nightmares", hp: 0 }, // Different phase HPs
        { name: "The Author", hp: 24 }
    ];

    function initBoss() {
        projectiles.length = 0;
        bombs.length = 0;
        rocks.length = 0;
        windX = 0;
        
        let bData = BOSS_DATA[currentLevel - 1];
        bossNameEl.innerText = `BOSS: ${currentLevel}/10 ${bData.name}`;
        boss.hp = bData.hp;
        boss.maxHp = bData.hp;
        boss.invuln = 0;

        if (currentLevel === 1) {
            boss.x = 128; boss.y = 60; boss.angle = Math.random() * Math.PI * 2;
            boss.history = []; boss.segments = []; boss.numSegments = 5; boss.segmentRadius = 10;
            boss.baseSpeed = 1.2; boss.speed = 1.2; boss.turnSpeed = 0.05; boss.turnDir = 1;
            for(let i=0; i<boss.numSegments; i++) boss.segments.push({x: boss.x, y: boss.y});
        } else if (currentLevel === 2) {
            boss.x = 128; boss.y = 96; boss.jarHp = 3; boss.radius = 14;  
            boss.state = 'jar_move'; boss.timer = 60; boss.vx = 1.5; boss.vy = 1.5;
        } else if (currentLevel === 3) {
            boss.x = 128; boss.y = 96; boss.state = 'combined'; boss.radius = 24; boss.ramHp = 4;
            boss.eyes = []; boss.vx = 0.8; boss.vy = 0.5; 
        } else if (currentLevel === 4) {
            boss.state = 'swim'; boss.timer = 120; boss.chargeCooldown = 0; boss.x = 200; boss.y = 100; boss.radius = 26; 
            boss.lure = {x: 0, y: 0, radius: 8}; boss.vx = 1; boss.vy = 0; boss.fairies = []; player.dir = 'right';
        } else if (currentLevel === 5) {
            boss.state = 'hidden'; boss.timer = 60; boss.radius = 12; boss.tailAngle = 0;
            boss.holes = [{x: 48, y: 48, dx: 1, dy: 1}, {x: 208, y: 48, dx: -1, dy: 1}, {x: 48, y: 144, dx: 1, dy: -1}, {x: 208, y: 144, dx: -1, dy: -1}]; boss.holeIndex = 0;
        } else if (currentLevel === 6) {
            boss.state = 'hidden'; boss.timer = 120; boss.x = 128; boss.y = 96; boss.radius = 36; boss.alpha = 0;
            boss.tiles = []; for (let i = 0; i < 8; i++) boss.tiles.push({x: 40 + (i % 4) * 58, y: 50 + Math.floor(i / 4) * 80, z: 0, state: 'idle', timer: i * 80 + 90, vx: 0, vy: 0});
            boss.holes = []; boss.holeTimer = 90;
        } else if (currentLevel === 7) {
            boss.state = 'soar'; boss.timer = 120; boss.x = 300; boss.y = 40; boss.radius = 22; boss.vx = -2; boss.vy = 0;
        } else if (currentLevel === 8) {
            boss.state = 'lava_hide'; boss.timer = 90; boss.x = 128; boss.y = 96; boss.radius = 16; boss.vx = 0; boss.vy = 0;
        } else if (currentLevel === 9) {
            boss.shadowPhase = 1;
            setupShadowPhase();
        } else if (currentLevel === 10) {
            boss.state = 'author_float'; boss.timer = 0; boss.freezeCooldown = 500;
            boss.invisCooldown = 1000; boss.invisTimer = 0;
            boss.x = 128; boss.y = 96; boss.radius = 16;
            boss.worms = []; // Initialize worm army storage array
        }
        updateBossUI();
    }

    // Level 9 exclusive: Shadow Boss 6 phases initialization
    function setupShadowPhase() {
        boss.invuln = 0; boss.timer = 60; boss.z = 0; boss.vz = 0;
        projectiles = projectiles.filter(p => p.type === 'powder' || p.type === 'rod_fire'); // Clear previous projectiles
        let names = ["Giant Gel", "Agahnim", "Moldorm Shadow", "Ganon's Shadow", "Lanmola", "DethI"];
        bossNameEl.innerText = `BOSS: 9/10 ${names[boss.shadowPhase - 1]}`;

        if(boss.shadowPhase === 1) { 
            boss.hp = 3; boss.maxHp = 3; boss.radius = 20; boss.state = 'gel_idle'; boss.vx = 0; boss.vy = 0;
        } else if(boss.shadowPhase === 2) { 
            boss.hp = 4; boss.maxHp = 4; boss.state = 'agahnim_prep'; boss.targetX = 128; boss.targetY = 40; boss.radius = 16;
        } else if(boss.shadowPhase === 3) { 
            boss.hp = 8; boss.maxHp = 8; boss.angle = 0; boss.speed = 2.5; boss.baseSpeed = 2.5; boss.state = 'moldorm_move';
            boss.turnDir = 1; boss.turnSpeed = 0.08; boss.segments = []; boss.numSegments = 7; boss.segmentRadius = 14; 
            for(let i=0; i<boss.numSegments; i++) boss.segments.push({x: boss.x, y: boss.y}); boss.history = [];
        } else if(boss.shadowPhase === 4) { 
            boss.hp = 16; boss.maxHp = 16; boss.state = 'ganon_move'; boss.radius = 20; boss.trident = null;
        } else if(boss.shadowPhase === 5) { 
            boss.hp = 1; boss.maxHp = 1; boss.state = 'lanmola_move'; boss.radius = 12; boss.vx = 4; boss.vy = 3;
        } else if(boss.shadowPhase === 6) { 
            boss.hp = 12; boss.maxHp = 12; boss.state = 'dethi_swing'; boss.radius = 24; boss.eyeOpen = false; boss.armAngle = 0; 
        }
        updateBossUI();
    }

    // New item actions
    function playerDropPowder() {
        if (player.freezeTimer > 0) return;
        if (player.state !== 'hurt' && player.powderCooldown <= 0 && !projectiles.some(p => p.type === 'powder')) {
            let px = player.x + (player.dir==='left'?-15:player.dir==='right'?15:0);
            let py = player.y + (player.dir==='up'?-15:player.dir==='down'?15:0);
            projectiles.push({x: px, y: py, vx: 0, vy: 0, life: 25, type: 'powder'});
            player.powderCooldown = 10;
        }
    }
    function playerShootRod() {
        if (player.freezeTimer > 0) return;
        if (player.state !== 'hurt' && !projectiles.some(p => p.type === 'rod_fire')) {
            let vx = player.dir==='left'?-6:player.dir==='right'?6:0;
            let vy = player.dir==='up'?-6:player.dir==='down'?6:0;
            if(vx===0 && vy===0) vy = 6; // Default downward
            projectiles.push({x: player.x, y: player.y, vx: vx, vy: vy, life: 60, type: 'rod_fire'});
        }
    }

    function playerShootArrow() {
        if (player.freezeTimer > 0) return;
        if (player.state !== 'hurt' && !projectiles.some(p => p.type === 'arrow') && player.arrowCooldown <= 0) {
            let vx = player.dir === 'left' ? -8 : player.dir === 'right' ? 8 : 0;
            let vy = player.dir === 'up' ? -8 : player.dir === 'down' ? 8 : 0;
            if (vx === 0 && vy === 0) vy = 8;
            projectiles.push({x: player.x, y: player.y, vx: vx, vy: vy, life: 50, type: 'arrow'});
            player.arrowCooldown = 10;
        }
    }

    // Original actions
    function playerInteract() {
        if (player.freezeTimer > 0) return;
        if (currentLevel !== 2) return;
        if (player.carrying) {
            player.carrying = false; boss.state = 'thrown'; boss.vx = 0; boss.vy = 0;
            if (player.dir === 'up') boss.vy = -5; if (player.dir === 'down') boss.vy = 5;
            if (player.dir === 'left') boss.vx = -5; if (player.dir === 'right') boss.vx = 5;
        } else if (boss.state === 'jar_stunned') {
            if (Math.hypot(player.x - boss.x, player.y - boss.y) < 24) { player.carrying = true; boss.state = 'carried'; boss.carryTimer = 360; }
        }
    }
    function playerDash() {
        if (player.freezeTimer > 0) return;
        if (currentLevel === 4) return;
        if (player.state === 'idle' || player.state === 'walk') { player.state = 'dash'; player.timer = 15; player.hasHit = false; player.vx = 0; player.vy = 0; }
    }
    function playerJump() { 
        if (player.freezeTimer > 0) return;
        if (currentLevel === 4) return; 
        if (player.z === 0 && (player.state === 'idle' || player.state === 'walk')) player.vz = 6; 
    }
    function playerHookshot() {
        if (player.freezeTimer > 0) return;
        if (currentLevel === 4) return;
        if (player.state === 'idle' || player.state === 'walk') {
            player.state = 'hookshot'; hookshot.active = true; hookshot.returning = false; hookshot.length = 0; hookshot.attachedBoss = false; hookshot.x = player.x; hookshot.y = player.y;
            let s = 6; hookshot.vx = 0; hookshot.vy = 0;
            if (player.dir === 'up') hookshot.vy = -s; if (player.dir === 'down') hookshot.vy = s;
            if (player.dir === 'left') hookshot.vx = -s; if (player.dir === 'right') hookshot.vx = s;
        }
    }
    function playerAttack() {
        if (player.freezeTimer > 0) return;
        if (player.state === 'idle' || player.state === 'walk') { 
            player.state = 'attack'; player.timer = 12; player.hasHit = false; player.vx = 0; player.vy = 0; 
        }
    }
    function playerDropBomb() {
        if (player.freezeTimer > 0) return;
        if ((player.state === 'idle' || player.state === 'walk') && bombs.length < 2) bombs.push({x: player.x, y: player.y, timer: 90, state: 'ticking'});
    }

    function update() {
        if (player.invuln > 0) player.invuln--;
        if (player.attackCooldown > 0) player.attackCooldown--;
        if (player.powderCooldown > 0) player.powderCooldown--;
        if (player.arrowCooldown > 0) player.arrowCooldown--;
        if (player.z > 0 || player.vz !== 0) {
            player.z += player.vz; player.vz -= 0.5;
            if (player.z <= 0) { player.z = 0; player.vz = 0; }
        }

        // Level 7 strong wind
        if (currentLevel === 7) {
            player.x += windX;
            if ((player.x < 32 || player.x > 224 || player.y < 32 || player.y > 160) && player.z === 0) {
                player.hp--; updateHearts(); player.x = 128; player.y = 100; player.invuln = 60;
                if(player.hp <= 0) { alert("Game Over..."); player.hp = player.maxHp; player.x = 128; player.y = 160; initBoss(); updateHearts(); return; }
            }
        }
        
        // Level 8 lava
        if (currentLevel === 8 && player.z === 0) {
            if (player.x > 48 && player.x < 208 && player.y > 48 && player.y < 144) {
                player.hp--; updateHearts(); player.x = 128; player.y = 160; player.invuln = 60;
                if(player.hp <= 0) { alert("Game Over..."); player.hp = player.maxHp; player.x = 128; player.y = 160; initBoss(); updateHearts(); return; }
            }
        }

        // Bomb update
        for (let i = bombs.length - 1; i >= 0; i--) {
            let b = bombs[i];
            if (b.state === 'ticking') {
                b.timer--;
                if (b.timer <= 0) {
                    b.state = 'exploding'; b.timer = 15;
                    if (currentLevel === 6 && boss.state === 'visible') {
                        if (Math.hypot(boss.x - b.x, boss.y - b.y) < boss.radius + 24) {
                            boss.hp--; boss.invuln = 20; bgFlash();
                            if (boss.hp <= 0) { player.maxHp++; player.hp = player.maxHp; alert("Entering Level 7!"); currentLevel = 7; initBoss(); updateHearts(); }
                        }
                    }
                    if (currentLevel === 7) {
                        if (Math.hypot(boss.x - b.x, boss.y - b.y) < boss.radius + 24) { bossDamage7(); }
                    }
                    if (Math.hypot(player.x - b.x, player.y - b.y) < player.radius + 24 && player.invuln <= 0 && player.state !== 'hurt' && player.z < 10) {
                        player.hp--; updateHearts(); triggerPlayerKnockback(b); player.invuln = 60;
                        if(player.hp <= 0) { alert("Game Over..."); player.hp = player.maxHp; player.x = 128; player.y = 160; initBoss(); updateHearts(); }
                    }
                }
            } else if (b.state === 'exploding') {
                b.timer--; if (b.timer <= 0) bombs.splice(i, 1);
            }
        }

        // Falling rock update
        for (let i = rocks.length - 1; i >= 0; i--) {
            let r = rocks[i]; r.y += r.vy;
            if (r.y >= r.targetY) {
                rocks.splice(i, 1);
            } else if (Math.hypot(player.x - r.x, player.y - r.y) < player.radius + 8 && player.z === 0) {
                if (player.invuln <= 0 && player.state !== 'hurt') {
                    player.hp--; updateHearts(); triggerPlayerKnockback(r); player.invuln = 60;
                    if(player.hp <= 0) { alert("Game Over..."); player.hp = player.maxHp; player.x = 128; player.y = 160; initBoss(); updateHearts(); }
                }
                rocks.splice(i, 1); 
            }
        }

        // Player state machine
        if (player.freezeTimer > 0) {
            player.freezeTimer--;
            player.state = 'idle';
        } else if (player.state === 'hurt') {
            player.x += player.vx; player.y += player.vy; player.vx *= 0.85; player.vy *= 0.85;
            player.timer--; if (player.timer <= 0) player.state = 'idle';
        } else if (player.state === 'attack') {
            player.timer--; if (player.timer <= 0) player.state = 'idle';
            if (player.timer <= 12 && player.timer >= 2) checkSwordHit();
        } else if (player.state === 'dash') {
            player.timer--; let dashSpeed = 5;
            if (player.dir === 'up') player.y -= dashSpeed; if (player.dir === 'down') player.y += dashSpeed;
            if (player.dir === 'left') player.x -= dashSpeed; if (player.dir === 'right') player.x += dashSpeed;
            if (player.timer <= 0) {
                player.state = 'idle';
            }
        } else if (player.state === 'hookshot') {
            if (!hookshot.returning) {
                hookshot.x += hookshot.vx; hookshot.y += hookshot.vy; hookshot.length += 6;
                if (hookshot.length > 100 || hookshot.x < 16 || hookshot.x > 240 || hookshot.y < 24 || hookshot.y > 176) hookshot.returning = true;
                if (currentLevel === 5 && boss.state === 'popping_out') {
                    if (Math.hypot(hookshot.x - boss.x, hookshot.y - boss.y) < boss.radius + 4) { hookshot.returning = true; hookshot.attachedBoss = true; boss.state = 'dragged_out'; }
                }
            } else {
                let dx = player.x - hookshot.x, dy = player.y - hookshot.y; let dist = Math.hypot(dx, dy);
                if (dist < 8) { hookshot.active = false; player.state = 'idle'; if (currentLevel === 5 && hookshot.attachedBoss) { boss.state = 'exposed'; boss.timer = 120; } hookshot.attachedBoss = false; } 
                else { hookshot.x += (dx/dist) * 6; hookshot.y += (dy/dist) * 6; if (hookshot.attachedBoss) { boss.x = hookshot.x; boss.y = hookshot.y; } }
            }
        } else {
            let dx = 0, dy = 0;
            if (keys['ArrowUp'] || keys['KeyW']) dy -= 1; if (keys['ArrowDown'] || keys['KeyS']) dy += 1;
            if (keys['ArrowLeft'] || keys['KeyA']) dx -= 1; if (keys['ArrowRight'] || keys['KeyD']) dx += 1;
            if (currentLevel === 4) { if (dx < 0) player.dir = 'left'; else if (dx > 0) player.dir = 'right'; } 
            else { if (dy < 0) player.dir = 'up'; if (dy > 0) player.dir = 'down'; if (dx < 0) player.dir = 'left'; if (dx > 0) player.dir = 'right'; }
            if (dx !== 0 || dy !== 0) { player.state = 'walk'; const len = Math.hypot(dx, dy); player.x += (dx / len) * (player.carrying ? player.speed * 0.7 : player.speed); player.y += (dy / len) * (player.carrying ? player.speed * 0.7 : player.speed); } 
            else { player.state = 'idle'; }
        }

        // Boundary limits
        if (currentLevel === 4) {
            player.x = Math.max(16, Math.min(256 - 16, player.x)); player.y = Math.max(30, Math.min(192 - 16, player.y));
        } else if (currentLevel !== 7 && currentLevel !== 8) {
            player.x = Math.max(24, Math.min(256 - 24, player.x)); player.y = Math.max(32, Math.min(192 - 24, player.y));
        }

        if (currentLevel === 1) updateBoss1();
        else if (currentLevel === 2) updateBoss2();
        else if (currentLevel === 3) updateBoss3();
        else if (currentLevel === 4) updateBoss4();
        else if (currentLevel === 5) updateBoss5();
        else if (currentLevel === 6) updateBoss6();
        else if (currentLevel === 7) updateBoss7();
        else if (currentLevel === 8) updateBoss8();
        else if (currentLevel === 9) updateBoss9();
        else if (currentLevel === 10) updateBoss10();

        updateProjectiles();
        checkPlayerBossCollision();
    }

    function bossDamage7() {
        if (boss.invuln > 0) return;
        boss.hp--; boss.invuln = 20; bgFlash(); updateBossUI();
        if (boss.hp <= 0) {
            player.maxHp++; player.hp = player.maxHp;
            alert("Level 7: Evil Eagle defeated! Heart Container acquired!\nPrepare for the ultimate test: Hot Head!");
            currentLevel = 8; initBoss(); updateHearts();
        }
    }

    function bossDamage9() {
        if (boss.state === 'phase_transition') return;
        boss.hp--; boss.invuln = 20; bgFlash(); updateBossUI();
        if (boss.hp <= 0) {
            player.maxHp++; player.hp = player.maxHp; updateHearts();
            boss.shadowPhase++;
            if (boss.shadowPhase > 6) {
                alert("Congratulations! You defeated the Shadow Nightmares!\nWait... what is that sound?");
                currentLevel = 10; initBoss(); updateHearts();
            } else {
                boss.state = 'phase_transition'; // Transform into black ball and move to center
                boss.targetX = 128; boss.targetY = 96;
                boss.invuln = 9999;
            }
        }
    }

    function updateBoss9() {
        if (boss.hp <= 0 && boss.state !== 'phase_transition') return;
        if (boss.invuln > 0 && boss.state !== 'phase_transition') boss.invuln--;
        boss.timer--;

        if (boss.state === 'phase_transition') {
            let dx = boss.targetX - boss.x, dy = boss.targetY - boss.y;
            let dist = Math.hypot(dx, dy);
            if (dist < 2) {
                boss.x = boss.targetX; boss.y = boss.targetY;
                setupShadowPhase();
            } else {
                boss.x += (dx/dist) * 2; boss.y += (dy/dist) * 2;
            }
            return;
        }

        if (boss.shadowPhase === 1) { // Giant Gel - Jumping movement
            if (boss.z > 0 || boss.vz !== 0) {
                boss.z += boss.vz; boss.vz -= 0.2;
                boss.x += boss.vx; boss.y += boss.vy;
                if (boss.z <= 0) { boss.z = 0; boss.vz = 0; boss.vx = 0; boss.vy = 0; boss.timer = 45; }
            } else if (boss.timer <= 0) {
                let ang = Math.atan2(player.y - boss.y, player.x - boss.x);

    function updateProjectiles() {

            if (p.life !== undefined) { p.life--; if (p.life <= 0) { projectiles.splice(i, 1); continue; } }
            if (p.y > 200 || p.x < -20 || p.x > 280 || p.y < -20) { projectiles.splice(i, 1); continue; }
            
            if (currentLevel === 7 && boss.invuln <= 0) {
                if ((p.type === 'powder' || p.type === 'rod_fire') && Math.hypot(p.x - boss.x, p.y - boss.y) < boss.radius + 15) {
                    bossDamage7(); projectiles.splice(i, 1); continue;
                }
            }

            // Level 8 specific collision (Magic Rod damage only)
            if (currentLevel === 8 && boss.invuln <= 0 && boss.state === 'jump') {
                if (p.type === 'rod_fire' && Math.hypot(p.x - boss.x, p.y - boss.y) < boss.radius + 10) {

                    continue;
                }
            }

            // Level 10 Author specific collision (Reflect fireball)
            if (currentLevel === 10 && (!boss.invisTimer || boss.invisTimer <= 0)) {
                if (p.type === 'author_fire_reflected' && Math.hypot(p.x - boss.x, p.y - boss.y) < boss.radius) {

                    boss.y = 40 + Math.random() * 112;

            }
        }

    function checkSwordHit() {

        let sx = player.x, sy = player.y - player.z;

        const hitRadius = 20;

        if (currentLevel === 10) {
            // Level 10 Author hit logic
            if (boss.invisTimer <= 0) { // Invincible while invisible

            } else if (currentLevel === 4) {
                ctx.lineWidth = 2; ctx.strokeStyle = '#000'; boss.fairies.forEach(f => { ctx.fillStyle = "#ff9ff3"; ctx.beginPath(); ctx.arc(f.x|0, f.y|0, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#fff"; ctx.fillRect((f.x-2)|0, (f.y-2)|0, 2, 2); }); ctx.fillStyle = "#e67e22"; ctx.beginPath(); ctx.ellipse(boss.x|0, boss.y|0, boss.radius|0, (boss.radius*0.8)|0, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo((boss.x+boss.radius)|0, boss.y|0); ctx.lineTo((boss.x+boss.radius+15)|0, (boss.y-15)|0); ctx.lineTo((boss.x+boss.radius+15)|0, (boss.y+15)|0); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.moveTo((boss.x-boss.radius)|0, boss.y|0); ctx.lineTo((boss.x-10)|0, (boss.y+10)|0); ctx.lineTo((boss.x-boss.radius+10)|0, (boss.y+15)|0); ctx.fill(); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc((boss.x-10)|0, (boss.y-8)|0, 6, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle = "#000"; ctx.fillRect((boss.x-12)|0, (boss.y-9)|0, 3, 3); ctx.strokeStyle = "#7f8c8d"; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo((boss.x-5)|0, (boss.y-20)|0); ctx.quadraticCurveTo((boss.x-20)|0, (boss.y-30)|0, boss.lure.x|0, boss.lure.y|0); ctx.stroke(); ctx.lineWidth = 2; ctx.strokeStyle = '#000'; ctx.fillStyle = (boss.invuln > 0 && Math.floor(Date.now() / 50) % 2 === 0) ? "#fff" : "#f1c40f"; ctx.beginPath(); ctx.arc(boss.lure.x|0, boss.lure.y|0, boss.lure.radius|0, 0, Math.PI*2); ctx.fill(); ctx.stroke(); ctx.fillStyle = "rgba(241, 196, 15, 0.4)"; ctx.beginPath(); ctx.arc(boss.lure.x|0, boss.lure.y|0, (boss.lure.radius + 6 + Math.sin(Date.now()/100)*2)|0, 0, Math.PI*2); ctx.fill();

        if (timestamp - lastTime >= 1000 / FPS) {
